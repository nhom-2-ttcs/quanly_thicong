name: CI Pipeline (Build, Lint, Test)

on:
  push:
    branches: [ "main", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 1. Build & Install Dependencies
        run: |
          cd backend
          npm ci

      - name: 2. Run Lint Validation
        run: |
          cd backend
          npm run lint

      - name: Install Chromium for S-34 browser test
        run: npx playwright-core install --with-deps chromium
        working-directory: backend

      - name: 3. Start Docker Compose Stack
        env:
          FRONTEND_PORT: 8081
        run: |
          docker compose up -d --build

      - name: 4. Wait for Services Readiness
        run: |
          echo "Polling services readiness..."
          TIMEOUT=90
          ELAPSED=0

          check_endpoint() {
            local url=$1
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            [ "$status" = "200" ]
          }

          while [ $ELAPSED -lt $TIMEOUT ]; do
            if check_endpoint "http://localhost:5000/api/health" && \
               check_endpoint "http://localhost:5000/api/db-check" && \
               check_endpoint "http://localhost:5000/login.html"; then
              echo "✅ All services are healthy and responding with HTTP 200 after ${ELAPSED}s!"
              exit 0
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            echo "Waiting for services... (${ELAPSED}s / ${TIMEOUT}s)"
          done

          echo "❌ Timed out waiting for services to be ready after ${TIMEOUT}s!"
          echo "=== Docker Compose Status ==="
          docker compose ps
          echo "=== Database Logs ==="
          docker compose logs db --tail=100
          echo "=== Backend Logs ==="
          docker compose logs backend --tail=100
          echo "=== Frontend Logs ==="
          echo "No frontend service" || true --tail=100
          exit 1

      - name: 5. Run Automated Tests
        env:
          BACKEND_BASE_URL: http://localhost:5000
          FRONTEND_BASE_URL: http://localhost:5000
          REQUIRE_S34_BROWSER: 'true'
        run: |
          cd backend
          npm test

      - name: 6. Run S-34 E2E Offline 20 Photos Test (T-63, T-64, T-65 < 3 mins)
        env:
          BACKEND_BASE_URL: http://localhost:5000
          FRONTEND_BASE_URL: http://localhost:5000
          REQUIRE_S34_BROWSER: 'true'
        run: |
          cd backend
          npm run test:s34

      - name: Diagnostics on Failure
        if: failure()
        run: |
          echo "=== Diagnostics on Failure ==="
          docker compose ps
          echo "=== Database Logs ==="
          docker compose logs db --tail=100
          echo "=== Backend Logs ==="
          docker compose logs backend --tail=100
          echo "=== Frontend Logs ==="
          echo "No frontend service" || true --tail=100

      - name: Teardown Docker Stack
        if: always()
        run: |
          docker compose down
