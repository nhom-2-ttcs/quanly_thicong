<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Nền bo tròn dạng app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Viền sáng tinh tế -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <g filter="url(#shadow)">
    <!-- Biểu tượng Tòa nhà / Kết cấu phía sau -->
    <path d="M128 360 V220 L196 220 V360 Z" fill="rgba(255,255,255,0.25)" />
    <path d="M216 360 V170 L300 170 V360 Z" fill="rgba(255,255,255,0.4)" />
    <path d="M320 360 V240 L384 240 V360 Z" fill="rgba(255,255,255,0.25)" />
    
    <!-- Cửa sổ công trình -->
    <rect x="236" y="200" width="18" height="24" rx="3" fill="#1e3a8a" opacity="0.6"/>
    <rect x="264" y="200" width="18" height="24" rx="3" fill="#1e3a8a" opacity="0.6"/>
    <rect x="236" y="240" width="18" height="24" rx="3" fill="#1e3a8a" opacity="0.6"/>
    <rect x="264" y="240" width="18" height="24" rx="3" fill="#1e3a8a" opacity="0.6"/>
    
    <!-- Nón bảo hộ thi công (Construction Helmet) -->
    <!-- Đỉnh vòm nón -->
    <path d="M148 300 C150 200, 362 200, 364 300 Z" fill="url(#helmetGrad)" stroke="#ca8a04" stroke-width="4" />
    
    <!-- Sống gân giữa nón (Ridge) -->
    <path d="M244 206 C244 206, 256 198, 268 206 L266 295 L246 295 Z" fill="#fef9c3" opacity="0.8" />
    
    <!-- Vành nón -->
    <path d="M124 300 C124 292, 388 292, 388 300 C388 316, 360 324, 256 324 C152 324, 124 316, 124 300 Z" fill="#eab308" stroke="#ca8a04" stroke-width="3" />
    
    <!-- Dải phản quang trên nón -->
    <path d="M168 280 C200 274, 312 274, 344 280 L346 288 C312 282, 200 282, 166 288 Z" fill="#ffffff" opacity="0.9" />
  </g>
  
  <!-- Huy hiệu chữ viết tắt QL -->
  <g transform="translate(256, 400)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3">QL THI CÔNG</text>
  </g>
</svg>
