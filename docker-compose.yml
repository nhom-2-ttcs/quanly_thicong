services:
  db:
    image: mysql:8.0
    container_name: quanly_thicong_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: quanly_thicong
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: quanly_thicong_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=quanly_thicong
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  staging-monitor:
    build: .
    container_name: quanly_thicong_monitor
    restart: always
    command: ["node", "scripts/monitor_staging.js"]
    environment:
      - MONITOR_TARGET_URL=http://backend:5000/api/health/readiness
      - MONITOR_INTERVAL_SECONDS=30
      - MONITOR_ALERT_THRESHOLD_SECONDS=300
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TIMEOUT_MS=5000
    depends_on:
      - backend

volumes:
  db_data: